map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  client_max_body_size 10m;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # Login / register backend
  location /api/auth/ {
    proxy_pass http://auth-service:4001;
  }

  # Shops / products backend (everything else under /api)
  location /api/ {
    proxy_pass http://shop-service:4002;
  }

  # Images uploaded through shop-service (shared "uploads" volume)
  location /uploads/ {
    alias /data/uploads/;
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  # Next.js frontend (WebSocket upgrade needed for dev hot reload)
  location / {
    proxy_pass http://web:3000;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
